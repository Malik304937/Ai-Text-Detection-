<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>AI Text Detective — Linguistic & AI Authorship Analysis</title>
    <meta name="description" content="Analyze text from live camera OCR, documents, images, or direct input to detect linguistic patterns associated with AI and human writing." />
    <meta property="og:title" content="AI Text Detective — Linguistic & AI Authorship Analysis" />
    <meta property="og:description" content="Analyze text from live camera OCR, documents, images, or direct input to detect linguistic patterns associated with AI and human writing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Preconnect with non-blocking font fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <style>
      /* Fallback background so body is never bright white */
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <!-- Immediate branded splash screen inside #root to eliminate white screen while JS initializes -->
    <div id="root">
      <div id="app-initial-loader" style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 24px;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5, #2563eb, #8b5cf6); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; box-shadow: 0 12px 30px -6px rgba(79, 70, 229, 0.45);">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
        <div style="font-size: 20px; font-weight: 800; color: #ffffff; letter-spacing: -0.025em; margin-bottom: 6px;">
          AI Text Detective
        </div>
        <div style="font-size: 13px; color: #818cf8; font-weight: 500; margin-bottom: 14px;">
          Loading Forensic Workspace...
        </div>
        <div style="width: 140px; height: 3px; background-color: #1e293b; border-radius: 999px; overflow: hidden;">
          <div style="width: 45%; height: 100%; background: linear-gradient(90deg, #4f46e5, #38bdf8); border-radius: 999px; animation: loaderPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes loaderPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>

    <!-- Safety script: catches fatal syntax or bundle errors and displays recovery UI instead of a white screen -->
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('app-initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="max-width: 380px; padding: 20px; background: rgba(30, 41, 59, 0.7); border: 1px solid #dc2626; border-radius: 16px; text-align: center;">' +
            '<div style="color: #f87171; font-weight: 700; font-size: 16px; margin-bottom: 8px;">Initialization Notice</div>' +
            '<div style="color: #cbd5e1; font-size: 12px; margin-bottom: 16px; line-height: 1.4;">' + (e.message || 'An error occurred during app startup.') + '</div>' +
            '<button onclick="window.location.reload()" style="background: #4f46e5; color: white; border: none; padding: 10px 18px; font-size: 13px; font-weight: 600; border-radius: 10px; cursor: pointer;">Reload Application</button>' +
          '</div>';
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
